name: Tests

# The GUT tests against the library built on the runner, and the debug (editor) and release libraries
# of each platform and precision - the Linux ones in ci/docker/linux-sdk (libreloaded's image) for an
# old glibc, the Windows ones with MinGW, the Android ones (arm64) with the runner's NDK. The double
# precision API is dumped from libreloaded's godot-double. A pushed tag is a release: the addon with
# every library, as gnd_sfx-<tag>.zip on the GitHub release of that tag.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Build the library
        run: make compile-debug

      - name: Import project
        run: godot --headless --import --path demo

      - name: Run tests
        run: make test

  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, android]
        precision: [single, double]
        target: [release, debug]
        include:
          - {platform: linux, target: release, make: compile-release-linux}
          - {platform: linux, target: debug, make: compile-debug-linux}
          - {platform: windows, target: release, make: compile-windows-release}
          - {platform: windows, target: debug, make: compile-windows-debug}
          - {platform: android, target: release, make: compile-android-release}
          - {platform: android, target: debug, make: compile-android-debug}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # the double precision API comes from a double precision Godot: libreloaded's release of it
      - name: Fetch the double precision Godot
        if: matrix.precision == 'double'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download godot-$GODOT_VERSION-double -R MaSzyna-Reloaded/libreloaded \
            -p godot.linuxbsd.editor.double.x86_64 -O "$HOME/.local/bin/godot-double"
          chmod +x "$HOME/.local/bin/godot-double"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install MinGW
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build the ${{ matrix.platform }} ${{ matrix.precision }} ${{ matrix.target }} library
        run: make ${{ matrix.make }} PRECISION=${{ matrix.precision }}

      - uses: actions/upload-artifact@v4
        with:
          name: libgndsfx-${{ matrix.platform }}-${{ matrix.precision }}-${{ matrix.target }}
          path: addons/gnd_sfx/bin/${{ matrix.platform }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: libgndsfx-*
          path: artifacts

      # every library under addons/gnd_sfx/bin/<platform>, where libgndsfx.gdextension looks; the
      # addon's GUT tests stay out (a project without GUT would not parse them)
      - name: Package the addon
        run: |
          for artifact in artifacts/libgndsfx-*; do
            platform=$(basename "$artifact" | cut -d- -f2)
            mkdir -p "addons/gnd_sfx/bin/$platform"
            cp "$artifact"/* "addons/gnd_sfx/bin/$platform/"
          done
          zip -r "gnd_sfx-$GITHUB_REF_NAME.zip" addons/gnd_sfx -x 'addons/gnd_sfx/tests/*'
          unzip -l "gnd_sfx-$GITHUB_REF_NAME.zip" | grep libgndsfx

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "gnd_sfx-$GITHUB_REF_NAME.zip" --title "gnd_sfx $GITHUB_REF_NAME" --generate-notes
